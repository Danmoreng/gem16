name: Windows Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version. When supplied, it must match the root VERSION file."
        required: false
        type: string

permissions:
  contents: read

env:
  # CUDA 13.3.0 contains nvcc 13.3.33, matching the validated Windows lock.
  CUDA_CHOCO_VERSION: "13.3.0"

jobs:
  package-windows:
    name: Package Windows SM120a native archive
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify build submodules
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1
          git submodule status --recursive

      - name: Resolve release version
        shell: pwsh
        run: |
          $sourceVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($sourceVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "VERSION must contain one semantic version. Got '$sourceVersion'."
          }

          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}"
            } else {
              $version = $sourceVersion
            }
          }

          $releaseVersion = $version -replace '^v', ''
          if ($releaseVersion -ne $sourceVersion) {
            throw "Release version '$releaseVersion' must match VERSION '$sourceVersion'."
          }
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install pinned CUDA toolchain
        shell: pwsh
        run: |
          choco install cuda --version=$env:CUDA_CHOCO_VERSION -y --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "CUDA Chocolatey installation failed with exit code $LASTEXITCODE"
          }

      - name: Configure CUDA environment
        shell: pwsh
        run: |
          $cudaBase = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA"
          $candidates = @()
          if ($env:CUDA_PATH) {
            $candidates += $env:CUDA_PATH
          }
          if (Test-Path -LiteralPath $cudaBase) {
            $candidates += Get-ChildItem -LiteralPath $cudaBase -Directory |
              Sort-Object { [version]($_.Name -replace '^v', '') } -Descending |
              ForEach-Object { $_.FullName }
          }

          $cudaRoot = $candidates |
            Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ "bin\nvcc.exe")) } |
            Select-Object -First 1
          if (-not $cudaRoot) {
            throw "CUDA Toolkit was installed, but nvcc.exe was not found under $cudaBase."
          }

          $cudaBin = Join-Path $cudaRoot "bin"
          "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CUDAToolkit_ROOT=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          $cudaBin | Out-File -FilePath $env:GITHUB_PATH -Append

          $nvccVersion = & (Join-Path $cudaBin "nvcc.exe") --version | Out-String
          $nvccVersion
          if ($nvccVersion -notmatch 'release 13\.3') {
            throw "Expected the pinned CUDA 13.3 toolchain."
          }

      - name: Build CUDA release server
        shell: pwsh
        run: .\scripts\build.ps1 -Cuda -Test -Jobs 2

      - name: Verify native Blackwell instructions
        shell: pwsh
        run: python .\tools\verify_sm120_sass.py .\build\Windows\blackwell-release\bin\gem16-server.exe

      - name: Package headless server
        shell: pwsh
        run: python .\tools\package_server.py --binary .\build\Windows\blackwell-release\bin\gem16-server.exe --platform windows-x64

      - name: Package native Studio
        shell: pwsh
        run: .\scripts\package-studio.ps1

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $package = Get-Item .\build\packages\gem16-windows-x64.zip

          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $artifactName = "gem16-$env:RELEASE_VERSION-windows-x64-sm120a.zip"
          $artifactPath = Join-Path (Resolve-Path artifacts) $artifactName
          Copy-Item -LiteralPath $package.FullName -Destination $artifactPath
          $hash = Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $artifactName" |
            Set-Content -LiteralPath "$artifactPath.sha256" -Encoding ascii
          Copy-Item .\build\packages\gem16-server-*-windows-x64.zip* artifacts
          Get-ChildItem artifacts | Format-Table Name, Length

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gem16-windows-${{ env.RELEASE_VERSION }}
          path: artifacts/*
          if-no-files-found: error

      # Candidate upload only. Tag creation cannot bypass the open two-platform,
      # GPU and clean-machine gates. Publication requires separate explicit
      # authorization and tools/verify_release_gates.py against these artifacts.
