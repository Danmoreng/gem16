name: cross-platform-host-ci

on:
  push:
  pull_request:

jobs:
  linux-host:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact source revision
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          git init source
          git -C source remote add origin "$SERVER/$REPOSITORY"
          git -C source fetch --depth=1 origin "$REVISION"
          git -C source checkout --detach FETCH_HEAD
      - name: Prepare Python test environment
        run: |
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
        working-directory: source
      - name: Configure
        run: cmake --preset host-debug
        working-directory: source
      - name: Build
        run: cmake --build --preset host-debug --parallel
        working-directory: source
      - name: Test
        run: ctest --preset host-debug
        working-directory: source
      - name: Build and test native Studio
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgtk-3-dev libwayland-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev pkg-config wayland-protocols
          cmake -S nativeStudio -B build/native-studio -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/native-studio --parallel 2
          ctest --test-dir build/native-studio --output-on-failure
        working-directory: source
      - name: Check Python tools
        run: |
          . .ci-venv/bin/activate
          python -m py_compile \
            tools/compare_manifests.py \
            tools/benchmark_vllm.py \
            tools/compare_logits.py \
            tools/compare_quality_benchmarks.py \
            tools/benchmark_quality.py \
            tools/fetch_model.py \
            tools/generate_golden.py \
            tools/generate_llama_golden.py \
            tools/inspect_checkpoint.py \
            tools/inspect_gguf.py \
            tools/validate_inference.py \
            tools/validate_layer_checkpoint.py \
            tools/verify_sm120_sass.py \
            tools/summarize_llama_bench.py \
            tools/gemma4_26b_moe_oracle.py \
            tools/update_gemma4_26b_plan_integrity.py
          python tools/update_gemma4_26b_plan_integrity.py --validate-source
          python -m unittest discover -s tests/python -v
        working-directory: source

  windows-host:
    runs-on: windows-2022
    steps:
      - name: Fetch exact source revision
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
        run: |
          git init source
          git -C source remote add origin "$env:SERVER/$env:REPOSITORY"
          git -C source fetch --depth=1 origin "$env:REVISION"
          git -C source checkout --detach FETCH_HEAD
      - name: Prepare Python test environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .ci-venv
          .\.ci-venv\Scripts\python.exe -m pip install --disable-pip-version-check -r tools/requirements-ci.txt
          "$PWD\.ci-venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        working-directory: source
      - name: Configure, build, and test
        shell: pwsh
        run: .\scripts\build.ps1 -Test -PythonExecutable "$PWD\.ci-venv\Scripts\python.exe"
        working-directory: source
      - name: Build and test native Studio
        shell: pwsh
        run: |
          . .\scripts\windows-toolchain.ps1
          Import-Gem16VisualStudioEnvironment
          cmake.exe -S nativeStudio -B build\Windows\native-studio-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake.exe --build build\Windows\native-studio-ci --config Release --parallel 2
          ctest.exe --test-dir build\Windows\native-studio-ci -C Release --output-on-failure
        working-directory: source
      - name: Check Python tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          .\.ci-venv\Scripts\Activate.ps1
          python -m py_compile tools/compare_manifests.py tools/benchmark_vllm.py tools/benchmark_quality.py tools/compare_logits.py tools/compare_quality_benchmarks.py tools/fetch_model.py tools/generate_golden.py tools/generate_llama_golden.py tools/inspect_checkpoint.py tools/inspect_gguf.py tools/validate_inference.py tools/validate_layer_checkpoint.py tools/verify_sm120_sass.py tools/summarize_llama_bench.py tools/gemma4_26b_moe_oracle.py tools/update_gemma4_26b_plan_integrity.py
          python tools/update_gemma4_26b_plan_integrity.py --validate-source
          python -m unittest discover -s tests/python -v
        working-directory: source
